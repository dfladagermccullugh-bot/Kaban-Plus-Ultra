# Self-host bundle — Phase 7 kickoff.
#
# Brings up Kaban Plus Ultra behind Caddy (auto-HTTPS) and points it at a
# Supabase project. Two ways to provide that project:
#
#   1. Hosted Supabase  — leave the `supabase` service commented out below,
#      set NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY in `.env` to your cloud
#      project's values. This is the simplest path and what we run in dev.
#
#   2. Fully self-hosted — pull the upstream Supabase compose file
#      (https://github.com/supabase/supabase/blob/master/docker/docker-compose.yml)
#      into this same directory and `docker compose -f docker-compose.yml -f
#      supabase/docker-compose.yml up`. See docs/SELF_HOSTING.md.
#
# Both modes apply the SQL in supabase/migrations/ via `psql` before first
# boot (see docs/SELF_HOSTING.md → "Apply migrations").

name: kaban

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL:          ${NEXT_PUBLIC_SITE_URL}
    image: kaban-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL:          ${NEXT_PUBLIC_SITE_URL}
      # Server-only; needed for invite-by-email + audit-events writer.
      SUPABASE_SERVICE_ROLE_KEY:     ${SUPABASE_SERVICE_ROLE_KEY}
      # First-run wizard gate. Empty disables /setup.
      SETUP_TOKEN:                   ${SETUP_TOKEN:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      KABAN_HOST: ${KABAN_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── Optional: a tiny stand-alone Postgres for `psql`-only workflows.
  #    For a full self-hosted Supabase, use the upstream compose instead;
  #    see docs/SELF_HOSTING.md.
  # postgres:
  #   image: postgres:17-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  # pg_data:
