# Bundled stack: Kaban Plus Ultra (web + caddy) merged on top of the upstream
# Supabase self-host compose pinned in ./supabase/PIN.
#
# Prereq: run `./supabase/fetch.sh` once. That unpacks the upstream
# `docker/` subtree into `./supabase/upstream/docker/` (bind-mounted volumes
# and all). After that:
#
#   docker compose -f kaban-stack.yml up -d
#   ./bootstrap.sh                     # applies supabase/migrations/*.sql
#
# Requires Docker Compose v2.20+ for `include:` support.

name: kaban-stack

# `include:` merges the upstream Supabase compose into this project. Relative
# paths inside the included file resolve against its own directory, so
# upstream's `./volumes/...` bind mounts still find their files under
# `./supabase/upstream/docker/volumes/...`. We keep upstream stock — no
# overrides here — so re-pinning is a single-file change in ./supabase/PIN.
include:
  - path: ./supabase/upstream/docker/docker-compose.yml
  - path: ./docker-compose.yml

# Overrides on top of the merged graph.
#
# - web: depend on the upstream `kong` gateway being healthy before we start,
#        and point its public-Supabase URL at kong's in-network address. We
#        keep NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} build-arg
#        so the browser bundle can still talk to the public hostname; the
#        runtime env below is what server-side calls (middleware, RSC) use.
services:
  web:
    depends_on:
      kong:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SUPABASE_URL:  ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SETUP_TOKEN:               ${SETUP_TOKEN:-}
      # Internal URL used by server-side @supabase/ssr clients; keeps the
      # auth/realtime/rest hops on the docker network instead of hairpinning
      # out through caddy.
      SUPABASE_INTERNAL_URL:     http://kong:8000

  # ── Postgres backup side-car ──────────────────────────────────────────────
  # Streams a gzipped `pg_dumpall` of the upstream Supabase `db` service to
  # ./backups/ on the host every BACKUP_INTERVAL_SECONDS (default daily).
  # Rotates dumps older than BACKUP_RETENTION_DAYS (default 14). The
  # container reports unhealthy when no fresh dump has landed in
  # 2 × interval, so `docker compose ps` surfaces silent failures.
  #
  # Restore (from inside the docker/ directory):
  #   gunzip -c backups/kaban-<ts>.sql.gz \
  #     | docker compose -f kaban-stack.yml exec -T db \
  #         psql -U postgres -v ON_ERROR_STOP=1
  #
  # Disable by setting `profiles: ["disabled"]` here or by stopping just
  # this service: `docker compose -f kaban-stack.yml stop db-backup`.
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST:                  db
      PGPORT:                  5432
      PGUSER:                  postgres
      PGPASSWORD:              ${POSTGRES_PASSWORD}
      PGDATABASE:              postgres
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS:   ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIR:              /backups
    volumes:
      - ./backups:/backups
      - ./backup/run.sh:/usr/local/bin/run-backup.sh:ro
      - ./backup/healthcheck.sh:/usr/local/bin/backup-healthcheck.sh:ro
    entrypoint: ["sh", "/usr/local/bin/run-backup.sh"]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/backup-healthcheck.sh"]
      interval: 1m
      timeout: 5s
      retries: 3
      # First dump runs immediately at boot; give it 5 minutes to land
      # against a fresh, still-restoring db on a small VPS.
      start_period: 5m
