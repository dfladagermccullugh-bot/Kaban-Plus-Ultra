name: Deploy smoke (local Docker)

# Brings the full bundled self-host stack up on a clean Ubuntu runner via
# the same `install-kaban.sh` one-liner an operator runs, then probes
# `/setup` for HTTP 200. Catches the ADR-0022 class of regressions
# (env wiring, Dockerfile platform args, installer path mangling, the
# Postgres bind-mount hazard, the Caddy localhost scheme).
#
# Not on every push — the upstream Supabase stack (~15 containers) is
# heavy. Runs on a nightly schedule, on manual dispatch, and on PRs that
# touch the deploy surface.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - 'scripts/install-kaban.sh'
      - 'docker/**'
      - 'apps/web/lib/env.ts'
      - 'apps/web/lib/supabase/**'
      - 'apps/web/app/setup/**'
      - '.github/workflows/deploy-smoke.yml'

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The full Supabase stack pull + Next standalone build is slower than a
    # plain CI run; cap generously but fail fast on a hung install. The
    # /setup probe itself is bounded to 3 min below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install + bring up the bundled stack
        env:
          KABAN_HOST: localhost
        run: bash scripts/install-kaban.sh

      - name: Probe /setup for HTTP 200
        run: |
          set -euo pipefail
          token="$(grep '^SETUP_TOKEN=' docker/.env | cut -d= -f2-)"
          if [ -z "$token" ]; then
            echo "::error::SETUP_TOKEN missing from docker/.env — installer env patch failed"
            exit 1
          fi
          url="http://localhost/setup?t=${token}"
          echo "Probing $url"
          deadline=$(( $(date +%s) + 180 ))
          code=000
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)"
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "Final status: $code"
          test "$code" = "200"

      - name: Assert browser Supabase paths route to Kong (not Next)
        run: |
          set -euo pipefail
          # supabase-js and the first-run magic link hit these on the public
          # origin. Without the Caddyfile reverse-proxy routes they 404
          # against the Next app instead of reaching Kong → GoTrue. Replicate
          # a browser request (Kong's key-auth requires the apikey supabase-js
          # always sends); GoTrue /health returns 200 JSON naming itself.
          key="$(grep '^ANON_KEY=' docker/.env | cut -d= -f2-)"
          if [ -z "$key" ]; then
            echo "::error::ANON_KEY missing from docker/.env"
            exit 1
          fi
          url="http://localhost/auth/v1/health"
          echo "Probing $url"
          body="$(curl -fsS -H "apikey: $key" "$url")"
          echo "Body: $body"
          echo "$body" | grep -q GoTrue || {
            echo "::error::/auth/v1/* did not reach Kong → GoTrue (Caddy proxy route missing?)"
            exit 1
          }

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          cd docker
          docker compose -f kaban-stack.yml ps || true
          docker compose -f kaban-stack.yml logs --tail=120 web caddy kong db || true
