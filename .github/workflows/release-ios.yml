name: Release iOS (TestFlight)

# Staged workflow shell. Wraps `scripts/release-ios.sh` so a tag push or
# manual dispatch triggers a TestFlight upload. Does NOT run end-to-end
# until:
#   1. `apps/mobile/ios/` is checked in (generated locally via
#      `npx cap add ios` on a macOS dev machine with Xcode 15+).
#   2. The repository secrets below are populated:
#        - APPLE_ID                  (App Store Connect account email)
#        - APP_SPECIFIC_PASSWORD     (appleid.apple.com → app-specific)
#        - TEAM_ID                   (10-char Apple Developer team ID)
#        - IOS_BUILD_CERTIFICATE_P12       (base64-encoded .p12)
#        - IOS_BUILD_CERTIFICATE_PASSWORD  (.p12 password)
#        - KEYCHAIN_PASSWORD               (any random string)
#   3. An `ExportOptions.plist` exists at `apps/mobile/ios/ExportOptions.plist`
#      with `$TEAM_ID` substituted (template lives in-repo).
#
# Until then this workflow is `workflow_dispatch`-only so it cannot run by
# accident. Flip on `release.published` once a manual TestFlight upload
# has succeeded at least once.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or SHA) to build'
        required: true
        default: 'main'
  # release:
  #   types: [published]

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive + upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    environment: ios-release
    steps:
      - name: Preflight — confirm native project is checked in
        run: |
          if [ ! -d apps/mobile/ios/App ]; then
            echo "::error::apps/mobile/ios/App not found — run \`npx cap add ios\` on a dev machine and commit the result before this workflow can run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        env:
          IOS_BUILD_CERTIFICATE_P12: ${{ secrets.IOS_BUILD_CERTIFICATE_P12 }}
          IOS_BUILD_CERTIFICATE_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$IOS_BUILD_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_BUILD_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Substitute $TEAM_ID in ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          sed -i '' "s/\$TEAM_ID/$TEAM_ID/g" apps/mobile/ios/ExportOptions.plist

      - name: Archive + upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: ./scripts/release-ios.sh
